<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memberships — Chelsea Supporters Club Vancouver</title>
<meta name="description" content="Join Chelsea Vancouver for $30 CAD/year (Adult) or $10 CAD (Junior). Watch parties, Stamford Bridge tickets, pub points and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
/* ── MEMBERSHIPS PAGE ─────────────────────────────────────── */

.tier-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-top: 0;
}

.tier-card {
  border: 2px solid var(--border);
  border-radius: 14px;
  background: var(--white);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  position: relative;
}
.tier-card:hover {
  border-color: var(--blue);
  box-shadow: 0 12px 40px rgba(3,70,148,0.1);
  transform: translateY(-2px);
}
.tier-card.selected {
  border-color: var(--gold);
  box-shadow: 0 8px 32px rgba(219,161,17,0.2);
}
.tier-card__badge {
  position: absolute; top: 16px; right: 16px;
  background: var(--gold); color: var(--blue-dark);
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 3px;
}
.tier-card__header {
  padding: 28px 26px 20px;
  border-bottom: 1px solid var(--border);
}
.tier-card__radio {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--white);
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 14px; transition: all 0.2s; flex-shrink: 0;
}
.tier-card.selected .tier-card__radio {
  border-color: var(--gold); background: var(--gold);
}
.tier-card.selected .tier-card__radio::after {
  content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--blue-dark);
}
.tier-card__name { font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 800; color: var(--text); }
.tier-card__note { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tier-card__price {
  font-family: 'Archivo', sans-serif;
  font-size: 52px; font-weight: 900; color: var(--blue); line-height: 1; margin-top: 10px;
}
.tier-card.selected .tier-card__price { color: var(--gold); }
.tier-card__price sup { font-size: 24px; vertical-align: top; margin-top: 10px; }
.tier-card__price-note { font-size: 13px; color: var(--muted); font-weight: 400; font-family: 'Inter', sans-serif; }
.tier-card__perks { padding: 18px 26px 26px; list-style: none; }
.tier-card__perks li {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 14px; color: var(--muted); padding: 5px 0;
  border-bottom: 1px solid var(--border); line-height: 1.5;
}
.tier-card__perks li:last-child { border-bottom: none; }
.tier-card__perks li::before { content: '✓'; color: var(--blue); font-weight: 800; flex-shrink: 0; font-size: 13px; margin-top: 1px; }

/* CFC tiers explanation */
.cfc-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
.cfc-card {
  border: 1px solid var(--border); border-radius: 10px;
  padding: 18px 20px; background: var(--off-white);
}
.cfc-card__name { font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 800; color: var(--text); }
.cfc-card__price { font-family: 'Archivo', sans-serif; font-size: 30px; font-weight: 900; color: var(--blue); margin: 6px 0 4px; }
.cfc-card__note { font-size: 12px; color: var(--muted); }

/* Payment methods */
.payment-method {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 18px 20px; border: 2px solid var(--border);
  border-radius: 10px; cursor: pointer; transition: all 0.2s;
  background: var(--white);
}
.payment-method:hover { border-color: var(--blue); }
.payment-method.selected { border-color: var(--blue); background: #eff6ff; }
.payment-method__icon { font-size: 24px; flex-shrink: 0; margin-top: 1px; }
.payment-method__title { font-family: 'Archivo', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); }
.payment-method__note { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.5; }

/* Summary card */
.summary-card {
  background: var(--blue-dark); border-radius: 14px;
  padding: 28px; position: sticky; top: 88px;
}
.summary-card__title { font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.45); margin-bottom: 20px; }
.summary-card__tier { font-family: 'Archivo', sans-serif; font-size: 26px; font-weight: 900; color: var(--white); }
.summary-card__price { font-family: 'Archivo', sans-serif; font-size: 48px; font-weight: 900; color: var(--gold); line-height: 1; margin: 8px 0 4px; }
.summary-card__price-note { font-size: 13px; color: rgba(255,255,255,0.4); }
.summary-card__divider { height: 1px; background: rgba(255,255,255,0.08); margin: 20px 0; }
.summary-card__row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; }
.summary-card__row span:first-child { color: rgba(255,255,255,0.5); }
.summary-card__row span:last-child { color: var(--white); font-weight: 600; }

/* Renewal banner */
.renewal-banner {
  background: #fff7ed; border: 1px solid #fed7aa;
  border-radius: 8px; padding: 14px 18px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 32px; font-size: 14px; color: #92400e;
}
.renewal-banner strong { color: var(--red); }

/* Success state */
.success-page {
  min-height: 70vh; display: flex; align-items: center;
  justify-content: center; background: var(--off-white);
}
.success-page__inner {
  max-width: 520px; text-align: center; padding: 48px 32px;
  background: var(--white); border: 1px solid var(--border);
  border-radius: 20px; box-shadow: 0 16px 48px rgba(3,70,148,0.08);
}

@media (max-width: 900px) {
  .tier-grid { grid-template-columns: 1fr; }
  .cfc-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared/components.jsx"></script>

<script type="text/babel">
const { useState } = React;

const TIERS = [
  {
    id: 'adult',
    name: 'Adult',
    price: 30,
    currency: 'CAD',
    note: 'Individual · Per year',
    perks: [
      'All Brass Fish watch parties',
      'Member-priority seating',
      'Pub points accrual (10 pts / match)',
      'CSCV member card',
      'Merchandise welcome pack',
      'Drink discount at The Brass Fish',
      'Stamford Bridge ticket eligibility',
      "Chelsea Supporters' Trust membership",
      'Access to group trips to London',
      'Members-only newsletter',
    ],
  },
  {
    id: 'junior',
    name: 'Junior',
    price: 10,
    currency: 'CAD',
    note: 'Under 18 · Per year',
    badge: null,
    perks: [
      'All of the above (with guardian)',
      'Chelsea FC Junior tie-in',
      'Priority junior seat reservation',
      'Under-18 welcome kit',
      'Junior pub points track',
    ],
  },
];

const CFC_TIERS = [
  { name: 'True Blue', price: '£60', period: '/yr', note: 'Highest home ticket priority · Required for SB requests' },
  { name: 'CFC Blue',  price: '£45', period: '/yr', note: 'Standard ticket priority' },
  { name: 'Junior',    price: '£20', period: '/yr', note: 'Under 16 · Parent/guardian required' },
];

const PAYMENT_METHODS = [
  { id: 'paypal',  icon: '🅿️', title: 'PayPal', note: 'Set up a recurring annual subscription. Renews automatically on July 1 each year.' },
  { id: 'card',    icon: '💳', title: 'Credit / Debit Card', note: 'One-time payment. Visa, Mastercard accepted. Processed securely.' },
  { id: 'interac', icon: '🍁', title: 'Interac e-Transfer', note: 'Send to chelseafcvancouver@gmail.com. Memo: "CSCV Membership 2025-26 — Your Name". Activates within 24 hrs.' },
];

function TierSelector({ selected, onSelect }) {
  return (
    <div className="tier-grid">
      {TIERS.map(t => (
        <div
          key={t.id}
          className={`tier-card${selected === t.id ? ' selected' : ''}`}
          onClick={() => onSelect(t.id)}
        >
          {t.badge && <div className="tier-card__badge">{t.badge}</div>}
          <div className="tier-card__header">
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
              <div className="tier-card__radio"></div>
              <div>
                <div className="tier-card__name">{t.name} Membership</div>
                <div className="tier-card__note">{t.note}</div>
              </div>
            </div>
            <div className="tier-card__price">
              <sup>$</sup>{t.price}
              <span className="tier-card__price-note"> {t.currency} / year</span>
            </div>
          </div>
          <ul className="tier-card__perks">
            {t.perks.map(p => <li key={p}>{p}</li>)}
          </ul>
        </div>
      ))}
    </div>
  );
}

function CFCExplainer() {
  return (
    <div style={{marginTop:40,padding:'28px 32px',background:'var(--off-white)',borderRadius:14,border:'1px solid var(--border)'}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:16,marginBottom:20,flexWrap:'wrap'}}>
        <div style={{flex:1}}>
          <div style={{fontFamily:'Archivo',fontSize:17,fontWeight:800,color:'var(--text)'}}>Also Need a Chelsea FC Membership?</div>
          <p style={{fontSize:13,color:'var(--muted)',marginTop:6,lineHeight:1.6,maxWidth:560}}>
            A CSCV membership is separate from Chelsea FC's own membership. You need an active Chelsea FC membership (True Blue or CFC Blue) to be eligible for Stamford Bridge ticket requests through us. Purchase directly at <a href="https://chelseafc.com" target="_blank" style={{color:'var(--blue)',fontWeight:600}}>chelseafc.com</a>. Prices shown in GBP.
          </p>
        </div>
        <a href="https://chelseafc.com" target="_blank" className="btn btn-primary btn-sm" style={{flexShrink:0}}>Chelsea FC Memberships ↗</a>
      </div>
      <div className="cfc-grid">
        {CFC_TIERS.map(t => (
          <div key={t.name} className="cfc-card">
            <div className="cfc-card__name">{t.name}</div>
            <div className="cfc-card__price">{t.price}<span style={{fontSize:14,fontWeight:400,fontFamily:'Inter',color:'var(--muted)'}}>{t.period}</span></div>
            <div className="cfc-card__note">{t.note}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Step1({ selected, onSelect, onNext }) {
  const tier = TIERS.find(t => t.id === selected);
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:32,alignItems:'start'}}>
      <div>
        <TierSelector selected={selected} onSelect={onSelect} />
        <CFCExplainer />
      </div>
      <div className="summary-card">
        <div className="summary-card__title">Your Selection</div>
        <div className="summary-card__tier">{tier.name} Membership</div>
        <div className="summary-card__price"><sup style={{fontSize:22,verticalAlign:'top',marginTop:8}}>$</sup>{tier.price}</div>
        <div className="summary-card__price-note">{tier.currency} per year · 2025–26 season</div>
        <div className="summary-card__divider"></div>
        {[
          ['Watch parties','✓ All matches'],
          ['Pub points','✓ From day one'],
          ['Ticket eligibility', tier.id === 'adult' ? '✓ Included' : '✓ With guardian'],
          ['Renewal date','June 30, 2026'],
        ].map(([k,v]) => (
          <div key={k} className="summary-card__row"><span>{k}</span><span>{v}</span></div>
        ))}
        <div className="summary-card__divider"></div>
        <button className="btn btn-gold btn-lg" style={{width:'100%'}} onClick={onNext}>
          Continue →
        </button>
        <div style={{fontSize:11,color:'rgba(255,255,255,0.3)',textAlign:'center',marginTop:10}}>
          🔒 Secure · PIPEDA compliant · Cancel anytime
        </div>
      </div>
    </div>
  );
}

function Step2({ form, setForm, onNext, onBack }) {
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:32,alignItems:'start'}}>
      <div>
        <h3 style={{fontFamily:'Archivo',fontSize:22,fontWeight:800,color:'var(--text)',marginBottom:24}}>Your Details</h3>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <div className="form-group">
            <label className="form-label">First Name *</label>
            <input className="form-input" placeholder="John" value={form.first} onChange={e=>setForm({...form,first:e.target.value})} required />
          </div>
          <div className="form-group">
            <label className="form-label">Last Name *</label>
            <input className="form-input" placeholder="Terry" value={form.last} onChange={e=>setForm({...form,last:e.target.value})} required />
          </div>
        </div>
        <div className="form-group">
          <label className="form-label">Email Address *</label>
          <input className="form-input" type="email" placeholder="john@example.com" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} />
        </div>
        <div className="form-group">
          <label className="form-label">Phone <span style={{fontWeight:400,textTransform:'none',letterSpacing:0}}>(for SMS match alerts — optional)</span></label>
          <input className="form-input" type="tel" placeholder="+1 604 000 0000" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} />
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <div className="form-group">
            <label className="form-label">Chelsea FC Membership # <span style={{fontWeight:400,textTransform:'none',letterSpacing:0}}>(optional)</span></label>
            <input className="form-input" placeholder="e.g. TB-00482917" value={form.cfcNum} onChange={e=>setForm({...form,cfcNum:e.target.value})} />
          </div>
          <div className="form-group">
            <label className="form-label">Chelsea FC Tier</label>
            <select className="form-select" value={form.cfcTier} onChange={e=>setForm({...form,cfcTier:e.target.value})}>
              <option value="">— Select if applicable —</option>
              <option>True Blue</option>
              <option>CFC Blue</option>
              <option>Junior</option>
              <option>None yet</option>
            </select>
          </div>
        </div>
        {form.tier === 'junior' && (
          <div className="form-group">
            <label className="form-label">Date of Birth <span style={{fontWeight:400,textTransform:'none',letterSpacing:0}}>(Junior eligibility verification)</span></label>
            <input className="form-input" type="date" value={form.dob} onChange={e=>setForm({...form,dob:e.target.value})} />
          </div>
        )}
        <div style={{background:'var(--off-white)',border:'1px solid var(--border)',borderRadius:8,padding:'14px 18px',marginBottom:24,fontSize:13,color:'var(--muted)',lineHeight:1.65}}>
          <label style={{display:'flex',gap:10,alignItems:'flex-start',cursor:'pointer'}}>
            <input type="checkbox" style={{marginTop:2,flexShrink:0,accentColor:'var(--blue)'}} required />
            <span>
              I agree to the <a href="#" style={{color:'var(--blue)',fontWeight:600}}>Terms & Conditions</a>. I consent to CSCV storing my data per the <a href="#" style={{color:'var(--blue)',fontWeight:600}}>Privacy Policy</a>, and sharing my name and membership number with Chelsea FC for supporters club administration.
            </span>
          </label>
        </div>
        <div style={{display:'flex',gap:12}}>
          <button className="btn btn-outline btn-md" onClick={onBack}>← Back</button>
          <button className="btn btn-primary btn-lg" style={{flex:1}} onClick={onNext}>Continue to Payment →</button>
        </div>
      </div>

      <div className="summary-card">
        <div className="summary-card__title">Order Summary</div>
        <div className="summary-card__tier">{form.tier === 'adult' ? 'Adult' : 'Junior'} Membership</div>
        <div className="summary-card__price"><sup style={{fontSize:22,verticalAlign:'top',marginTop:8}}>$</sup>{form.tier === 'adult' ? 30 : 10}</div>
        <div className="summary-card__price-note">CAD · 2025–26 season</div>
        {form.first && (
          <>
            <div className="summary-card__divider"></div>
            <div className="summary-card__row"><span>Name</span><span>{form.first} {form.last}</span></div>
            {form.email && <div className="summary-card__row"><span>Email</span><span style={{fontSize:12}}>{form.email}</span></div>}
          </>
        )}
      </div>
    </div>
  );
}

function Step3({ form, setForm, payment, setPayment, onSubmit, onBack }) {
  const price = form.tier === 'adult' ? 30 : 10;
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:32,alignItems:'start'}}>
      <div>
        <h3 style={{fontFamily:'Archivo',fontSize:22,fontWeight:800,color:'var(--text)',marginBottom:24}}>Payment</h3>

        <div style={{background:'var(--off-white)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
          <span style={{fontSize:14,color:'var(--muted)'}}>CSCV {form.tier==='adult'?'Adult':'Junior'} Membership 2025–26</span>
          <span style={{fontFamily:'Archivo',fontSize:22,fontWeight:900,color:'var(--blue)'}}>${price} <span style={{fontSize:13,fontWeight:400,color:'var(--muted)'}}>CAD</span></span>
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:28}}>
          {PAYMENT_METHODS.map(m => (
            <div key={m.id} className={`payment-method${payment===m.id?' selected':''}`} onClick={()=>setPayment(m.id)}>
              <div style={{width:20,height:20,borderRadius:'50%',border:'2px solid '+(payment===m.id?'var(--blue)':'var(--border)'),background:payment===m.id?'var(--blue)':'var(--white)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2,transition:'all 0.18s'}}>
                {payment===m.id && <div style={{width:7,height:7,borderRadius:'50%',background:'var(--white)'}}></div>}
              </div>
              <div className="payment-method__icon">{m.icon}</div>
              <div>
                <div className="payment-method__title">{m.title}</div>
                <div className="payment-method__note">{m.note}</div>
              </div>
            </div>
          ))}
        </div>

        {payment === 'card' && (
          <div style={{marginBottom:24}}>
            <div className="form-group">
              <label className="form-label">Card Number</label>
              <input className="form-input" placeholder="4242 4242 4242 4242" />
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
              <div className="form-group">
                <label className="form-label">Expiry</label>
                <input className="form-input" placeholder="MM / YY" />
              </div>
              <div className="form-group">
                <label className="form-label">CVC</label>
                <input className="form-input" placeholder="123" />
              </div>
            </div>
          </div>
        )}

        {payment === 'interac' && (
          <div className="info-box" style={{marginBottom:24,flexDirection:'column',alignItems:'flex-start',gap:6}}>
            <div style={{fontWeight:600,fontSize:14}}>Interac e-Transfer Instructions</div>
            <div style={{fontSize:13,lineHeight:1.7}}>
              Send <strong>${price} CAD</strong> to <strong>chelseafcvancouver@gmail.com</strong><br/>
              Memo: <strong>CSCV {form.tier==='adult'?'Adult':'Junior'} 2025-26 — {form.first} {form.last}</strong><br/>
              No security question needed. Membership activates within 24 hours.
            </div>
          </div>
        )}

        {payment === 'paypal' && (
          <div className="info-box" style={{marginBottom:24}}>
            <span style={{fontSize:14}}>You'll be redirected to PayPal to complete payment and set up an annual renewal. Renews automatically each July 1.</span>
          </div>
        )}

        <div style={{display:'flex',gap:12}}>
          <button className="btn btn-outline btn-md" onClick={onBack}>← Back</button>
          <button className="btn btn-gold btn-lg" style={{flex:1}} onClick={onSubmit}>
            {payment === 'interac' ? `I've Sent the Transfer →` : `Confirm & Pay $${price} CAD →`}
          </button>
        </div>
        <div style={{fontSize:12,color:'var(--muted)',textAlign:'center',marginTop:10}}>🔒 Secure payment · PIPEDA compliant · Cancel anytime by emailing chelseafcvancouver@gmail.com</div>
      </div>

      <div className="summary-card">
        <div className="summary-card__title">Order Summary</div>
        <div className="summary-card__tier">{form.tier==='adult'?'Adult':'Junior'} Membership</div>
        <div className="summary-card__price"><sup style={{fontSize:22,verticalAlign:'top',marginTop:8}}>$</sup>{price}</div>
        <div className="summary-card__price-note">CAD · 2025–26 season</div>
        <div className="summary-card__divider"></div>
        <div className="summary-card__row"><span>Subtotal</span><span>${price} CAD</span></div>
        <div className="summary-card__row"><span>Tax</span><span>$0.00</span></div>
        <div className="summary-card__divider"></div>
        <div className="summary-card__row">
          <span style={{color:'var(--white)',fontWeight:700,fontSize:15}}>Total</span>
          <span style={{color:'var(--gold)',fontFamily:'Archivo',fontSize:22,fontWeight:900}}>${price} CAD</span>
        </div>
        <div className="summary-card__divider"></div>
        <div style={{fontSize:12,color:'rgba(255,255,255,0.35)',lineHeight:1.6}}>Membership valid Jul 1, 2025 – Jun 30, 2026. Benefits begin immediately on payment confirmation.</div>
      </div>
    </div>
  );
}

function SuccessPage({ form }) {
  const price = form.tier === 'adult' ? 30 : 10;
  return (
    <div className="success-page">
      <div className="success-page__inner">
        <img src="uploads/Chelsea_Vancouver.png" alt="CSCV" style={{height:80,margin:'0 auto 24px'}} />
        <div style={{fontSize:48,marginBottom:8}}>💙</div>
        <h2 style={{fontFamily:'Archivo',fontSize:40,fontWeight:900,color:'var(--text)',textTransform:'uppercase',lineHeight:1,marginBottom:12}}>
          Welcome to CSCV!
        </h2>
        <p style={{fontSize:16,color:'var(--muted)',lineHeight:1.7,marginBottom:24}}>
          Your {form.tier === 'adult' ? 'Adult' : 'Junior'} membership is confirmed. Check your inbox at <strong style={{color:'var(--text)'}}>{form.email || 'your email'}</strong> for your member card and onboarding guide. See you at The Brass Fish — KTBFFH! 💙
        </p>
        <div style={{background:'#fffbee',border:'1px solid rgba(219,161,17,0.3)',borderRadius:8,padding:'14px 20px',fontSize:14,color:'var(--blue-dark)',marginBottom:20,textAlign:'left'}}>
          <div style={{fontWeight:700,marginBottom:6}}>What happens next?</div>
          <ul style={{listStyle:'none',paddingLeft:0}}>
            {['You'll receive a confirmation email within 10 minutes','Your CSCV member card will be emailed within 48 hours','Pub points will start accumulating at your next Brass Fish visit','You can request Stamford Bridge tickets once your Chelsea FC membership is verified'].map(s=>(
              <li key={s} style={{display:'flex',gap:8,padding:'4px 0',fontSize:13,color:'var(--muted)'}}>
                <span style={{color:'var(--blue)',fontWeight:700}}>✓</span>{s}
              </li>
            ))}
          </ul>
        </div>
        <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
          <a href="Matches.html" className="btn btn-primary btn-md">See Upcoming Matches</a>
          <a href="Home.html" className="btn btn-outline btn-md">Back to Home</a>
        </div>
      </div>
    </div>
  );
}

function MembershipsPage() {
  const [step, setStep] = useState(1);
  const [tier, setTier] = useState('adult');
  const [payment, setPayment] = useState('paypal');
  const [done, setDone] = useState(false);
  const [form, setForm] = useState({ first:'', last:'', email:'', phone:'', cfcNum:'', cfcTier:'', dob:'', tier:'adult' });

  const selectTier = id => { setTier(id); setForm(f => ({...f, tier: id})); };

  if (done) return (
    <div>
      <Nav />
      <SuccessPage form={form} />
      <Footer />
    </div>
  );

  return (
    <div>
      <Nav />

      <PageHeader
        label="2025–26 Season"
        title="Join Chelsea Vancouver"
        sub="Adult $30 CAD · Junior $10 CAD · Benefits start immediately · Cancel anytime"
        img="uploads/Screen_Shot_2022-08-02_at_2.30.52_PM.png"
      />

      {/* Renewal deadline banner */}
      <div style={{background:'#fff7ed',borderBottom:'1px solid #fed7aa',padding:'0'}}>
        <div style={{maxWidth:1200,margin:'0 auto',padding:'12px 40px'}}>
          <div className="renewal-banner" style={{margin:0,background:'transparent',border:'none',padding:0}}>
            <span style={{fontSize:18}}>⚠️</span>
            <span style={{fontSize:14,color:'#92400e'}}>
              Renewal deadline: <strong className="red" style={{color:'var(--red)'}}>June 15, 2025</strong> — renew before this date to maintain Stamford Bridge ticket eligibility for 2025–26.
              <a href="#" style={{marginLeft:8,color:'var(--blue)',fontWeight:600,fontSize:13}}>Why this matters →</a>
            </span>
          </div>
        </div>
      </div>

      <div style={{background:'var(--white)'}}>
        <div style={{maxWidth:1200,margin:'0 auto',padding:'48px 40px 80px'}}>
          <StepIndicator steps={['Choose Tier','Your Details','Payment']} current={step - 1} />

          {step === 1 && <Step1 selected={tier} onSelect={selectTier} onNext={() => setStep(2)} />}
          {step === 2 && <Step2 form={form} setForm={setForm} onNext={() => setStep(3)} onBack={() => setStep(1)} />}
          {step === 3 && <Step3 form={form} setForm={setForm} payment={payment} setPayment={setPayment} onSubmit={() => setDone(true)} onBack={() => setStep(2)} />}
        </div>
      </div>

      <Footer />
      <CookieBanner />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MembershipsPage />);
</script>
</body>
</html>
