<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Confirmed — Chelsea Supporters Club Vancouver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared/components.jsx"></script>
<script type="text/babel">
function AfterPaymentPage() {
  return (
    <div>
      <Nav />
      <div style={{minHeight:'80vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--off-white)',padding:'40px 20px'}}>
        <div style={{maxWidth:580,width:'100%'}}>
          {/* Confirmation card */}
          <div style={{background:'var(--white)',border:'1px solid var(--border)',borderRadius:16,padding:'40px',marginBottom:20,boxShadow:'0 8px 40px rgba(3,70,148,0.07)'}}>
            <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:28,paddingBottom:24,borderBottom:'1px solid var(--border)'}}>
              <div style={{background:'var(--blue)',borderRadius:10,padding:'8px 12px',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <img src="uploads/Chelsea_Vancouver.png" alt="CSCV" style={{height:36,width:36,objectFit:'contain'}} />
              </div>
              <div>
                <div style={{fontFamily:'Archivo',fontSize:20,fontWeight:800,color:'var(--text)'}}>Payment Confirmed</div>
                <div style={{fontSize:13,color:'var(--muted)',marginTop:2}}>Chelsea Supporters Club Vancouver</div>
              </div>
              <div style={{marginLeft:'auto',background:'#f0fdf4',border:'1px solid #86efac',borderRadius:6,padding:'5px 12px',fontSize:12,fontWeight:700,color:'#15803d',letterSpacing:'0.06em',textTransform:'uppercase'}}>Paid</div>
            </div>

            <h1 style={{fontFamily:'Archivo',fontSize:36,fontWeight:800,color:'var(--text)',textTransform:'uppercase',lineHeight:1,marginBottom:8}}>Welcome to CSCV</h1>
            <p style={{fontSize:15,color:'var(--muted)',lineHeight:1.7,marginBottom:28}}>Your membership is now active. A confirmation email has been sent with your member card and onboarding details. Here is what happens next.</p>

            <div style={{display:'flex',flexDirection:'column',gap:0}}>
              {[
                ['Confirmation email','Sent to your inbox within 10 minutes.'],
                ['Member card','Emailed within 48 hours. Bring it to the pub.'],
                ['Pub points','Start accumulating at your next Brass Fish visit.'],
                ['Ticket eligibility','Active once your Chelsea FC membership is verified.'],
                ['Welcome pack','Collected at your first watch party of the season.'],
              ].map(([title, detail], i) => (
                <div key={title} style={{display:'flex',gap:16,padding:'14px 0',borderBottom:'1px solid var(--border)'}}>
                  <div style={{width:24,height:24,borderRadius:'50%',background:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Archivo',fontSize:12,fontWeight:800,color:'var(--white)',flexShrink:0,marginTop:1}}>{i+1}</div>
                  <div>
                    <div style={{fontFamily:'Archivo',fontSize:14,fontWeight:700,color:'var(--text)'}}>{title}</div>
                    <div style={{fontSize:13,color:'var(--muted)',marginTop:2}}>{detail}</div>
                  </div>
                </div>
              ))}
            </div>

            <div style={{marginTop:28,display:'flex',gap:12,flexWrap:'wrap'}}>
              <a href="Matches.html" className="btn btn-primary btn-md">See Upcoming Matches</a>
              <a href="Pub Points.html" className="btn btn-outline btn-md">View Leaderboard</a>
              <a href="Home.html" className="btn btn-md" style={{background:'none',border:'1.5px solid var(--border)',color:'var(--muted)'}}>Back to Home</a>
            </div>
          </div>

          {/* Refer a friend */}
          <div style={{background:'var(--blue-dark)',borderRadius:12,padding:'24px 28px',display:'flex',alignItems:'center',gap:20,flexWrap:'wrap'}}>
            <div style={{flex:1}}>
              <div style={{fontFamily:'Archivo',fontSize:16,fontWeight:800,color:'var(--white)'}}>Know another Chelsea fan in Vancouver?</div>
              <div style={{fontSize:13,color:'rgba(255,255,255,0.45)',marginTop:4}}>Refer a friend and earn 25 bonus pub points when they join.</div>
            </div>
            <a href="Memberships.html" className="btn btn-primary btn-sm">Share Membership Link</a>
          </div>
        </div>
      </div>
      <Footer />
      <CookieBanner />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<AfterPaymentPage />);
</script>
</body>
</html>
