<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Chelsea Supporters Club Vancouver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" src="shared/components.jsx"></script>
<script type="text/babel">
function ThankYouPage() {
  return (
    <div>
      <Nav />
      <div style={{minHeight:'80vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--off-white)',padding:'40px 20px'}}>
        <div style={{maxWidth:540,textAlign:'center',background:'var(--white)',border:'1px solid var(--border)',borderRadius:16,padding:'52px 40px',boxShadow:'0 8px 40px rgba(3,70,148,0.08)'}}>

          <p style={{fontSize:16,color:'var(--muted)',lineHeight:1.7,marginBottom:28}}>Your submission has been received. We will be in touch within 48 hours. In the meantime, check out upcoming fixtures or explore your membership benefits.</p>

            <a href="Home.html" className="btn btn-primary btn-md">Back to Home</a>

          </div>
        </div>
      </div>
      <Footer />
    </div>
  );
}
