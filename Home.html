<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chelsea Supporters Club Vancouver</title>
<meta name="description" content="Vancouver's official Chelsea FC Platinum Supporters Club. Watch parties, Stamford Bridge tickets, pub points. Join for $30 CAD.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
/* ── HOME-SPECIFIC ────────────────────────────────────────── */

/* Hero */
.hero {
  position: relative; overflow: hidden;
  background: url('uploads/Screen_Shot_2022-08-02_at_2.30.52_PM.png') center 35% / cover no-repeat;
  border-bottom: 1px solid var(--border);
}
.hero__overlay {
  position: absolute; inset: 0;
  background: linear-gradient(
    to right,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,0.98) 38%,
    rgba(255,255,255,0.7) 58%,
    rgba(255,255,255,0.1) 100%
  );
}
.hero__inner {
  position: relative; z-index: 2;
  max-width: 1200px; margin: 0 auto; padding: 88px 40px 96px;
  display: grid; grid-template-columns: 1fr 400px; gap: 56px; align-items: center;
  width: 100%;
}
.hero__pattern { display: none; }
.hero__inner {
  position: relative; z-index: 2;
  max-width: 1200px; margin: 0 auto; padding: 80px 40px;
  display: grid; grid-template-columns: 1fr 400px; gap: 56px; align-items: center;
  width: 100%;
}

.hero__eyebrow {
  display: inline-block;
  color: var(--muted); font-size: 11px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  margin-bottom: 20px; white-space: nowrap;
  padding-bottom: 14px; border-bottom: 1px solid var(--border);
}

.hero__title {
  font-size: clamp(52px, 7vw, 88px);
  font-weight: 800; color: var(--blue-dark);
  line-height: 0.95; text-transform: uppercase;
  letter-spacing: 0em; margin-bottom: 6px;
}
.hero__title em { color: var(--blue-dark); font-style: normal; display: block; }
.hero__sub {
  font-size: 17px; color: var(--muted);
  margin: 20px 0 34px; line-height: 1.65; max-width: 460px; font-weight: 400;
}
.hero__actions { display: flex; gap: 14px; flex-wrap: wrap; }

/* Match card — frosted glass on image side */
.match-card {
  background: rgba(255,255,255,0.88);
  border: 1.5px solid rgba(255,255,255,0.9);
  border-radius: 14px; padding: 26px;
  backdrop-filter: blur(20px);
  box-shadow: 0 8px 40px rgba(2,44,92,0.18);
}
.match-card__label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
}
.match-card__countdown {
  display: flex; justify-content: center; gap: 4px; margin-bottom: 20px;
}
.countdown-unit { text-align: center; min-width: 52px; }
.countdown-num {
  font-family: 'Archivo', sans-serif; font-size: 36px; font-weight: 800;
  color: var(--blue-dark); line-height: 1; display: block;
}
.countdown-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.countdown-sep { font-family: 'Archivo', sans-serif; font-size: 32px; font-weight: 800; color: var(--border); line-height: 1; align-self: flex-start; padding-top: 2px; }

.match-card__teams {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin: 16px 0;
}
.match-team { text-align: center; flex: 1; }
.match-team__badge {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--border); display: flex; align-items: center;
  justify-content: center; font-size: 20px; margin: 0 auto 8px;
  border: 1px solid var(--border);
}
.match-team__name { font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 700; color: var(--text); }
.match-vs { font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 800; color: var(--border); }

.match-card__meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 18px; }
.match-meta-item { background: var(--white); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; }
.match-meta-item.span2 { grid-column: 1 / -1; }
.match-meta__label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.match-meta__val { font-family: 'Archivo', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }

.match-card__cta {
  width: 100%; background: var(--blue); color: var(--white);
  font-family: 'Archivo', sans-serif; font-size: 14px; font-weight: 800;
  letter-spacing: 0.04em; text-transform: uppercase; border: none;
  padding: 13px; border-radius: 7px; cursor: pointer; transition: background 0.18s;
  display: block; text-align: center;
}
.match-card__cta:hover { background: var(--blue-light); }

/* Stats strip */
.stats-strip {
  background: var(--blue-dark);
  border-top: none;
  border-bottom: none;
}
.stats-strip__inner {
  max-width: 1200px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.stat-item { padding: 32px 24px; text-align: center; border-right: 1px solid rgba(255,255,255,0.08); }
.stat-item:last-child { border-right: none; }
.stat-item__num { font-family: 'Archivo', sans-serif; font-size: 44px; font-weight: 800; color: var(--white); line-height: 1; }
.stat-item__label { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }

/* Membership preview */
.mem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
.mem-card {
  border-radius: 12px; border: 2px solid var(--border);
  overflow: hidden; background: var(--white);
  transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  cursor: pointer;
}
.mem-card:hover { border-color: var(--blue); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(3,70,148,0.12); }
.mem-card--featured { border-color: var(--gold); box-shadow: 0 8px 32px rgba(219,161,17,0.15); }
.mem-card--featured:hover { border-color: var(--gold); box-shadow: 0 16px 48px rgba(219,161,17,0.22); }
.mem-card__header { padding: 26px 24px 18px; border-bottom: 1px solid var(--border); position: relative; }
.mem-card__featured-badge {
  position: absolute; top: 18px; right: 18px;
  background: var(--gold); color: var(--blue-dark);
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 4px 9px; border-radius: 3px;
}
.mem-card__name { font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 800; color: var(--text); }
.mem-card__price { font-family: 'Archivo', sans-serif; font-size: 44px; font-weight: 900; color: var(--blue); line-height: 1; margin-top: 8px; }
.mem-card__price sup { font-size: 22px; vertical-align: top; margin-top: 8px; }
.mem-card__price span { font-size: 14px; color: var(--muted); font-weight: 400; font-family: 'Inter', sans-serif; }
.mem-card__body { padding: 18px 24px 24px; }
.mem-card__perks { list-style: none; }
.mem-card__perks li { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--muted); padding: 5px 0; line-height: 1.5; }
.mem-card__perks li::before { content: '✓'; color: var(--blue); font-weight: 700; flex-shrink: 0; }
.mem-card__btn { width: 100%; margin-top: 16px; display: block; text-align: center; }

/* Fixtures */
.fixture-row {
  display: flex; align-items: center; gap: 20px;
  padding: 18px 20px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--white);
  margin-bottom: 8px; transition: border-color 0.18s, box-shadow 0.18s;
}
.fixture-row:hover { border-color: var(--blue); box-shadow: 0 4px 16px rgba(3,70,148,0.07); }
.fixture-row--next { border-color: var(--blue); background: #eff6ff; }
.fixture-date { text-align: center; min-width: 52px; }
.fixture-date__day { font-family: 'Archivo', sans-serif; font-size: 28px; font-weight: 900; color: var(--text); line-height: 1; }
.fixture-date__month { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.fixture-divider { width: 1px; height: 44px; background: var(--border); flex-shrink: 0; }
.fixture-info { flex: 1; min-width: 0; }
.fixture-info__comp { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); margin-bottom: 3px; }
.fixture-info__teams { font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fixture-info__meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Leaderboard section */
.lb-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 18px; border-radius: 8px; margin-bottom: 6px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  transition: border-color 0.18s;
}
.lb-row:hover { border-color: rgba(219,161,17,0.3); }
.lb-row--you { background: rgba(3,70,148,0.25); border-color: rgba(3,70,148,0.5); }
.lb-rank { font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 900; color: rgba(255,255,255,0.2); min-width: 34px; }
.lb-rank--top { color: rgba(255,255,255,0.8); }
.lb-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 13px; color: var(--white); flex-shrink: 0; }
.lb-avatar--you { background: var(--white); color: var(--blue-dark); }
.lb-name { flex: 1; font-size: 14px; font-weight: 500; color: var(--white); }
.lb-pts { font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 900; color: var(--white); }
.lb-pts-sub { font-size: 10px; color: rgba(255,255,255,0.3); }

/* Pub partner */
.pub-block {
  background: var(--off-white); border: 1px solid var(--border); border-radius: 12px;
  padding: 28px 32px; display: flex; align-items: center; gap: 24px;
}
.pub-block__icon {
  width: 56px; height: 56px; border-radius: 10px;
  background: var(--blue-dark); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 800;
  color: var(--white); text-align: center; letter-spacing: 0.06em; text-transform: uppercase;
  line-height: 1.3;
}
.pub-block__body { flex: 1; }
.pub-block__name { font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 800; color: var(--text); }
.pub-block__detail { font-size: 14px; color: var(--muted); margin-top: 4px; line-height: 1.6; }

/* Newsletter strip */
.newsletter {
  background: var(--blue-dark);
  padding: 56px 0;
  border-top: 1px solid rgba(219,161,17,0.15);
}
.newsletter__inner {
  max-width: 1200px; margin: 0 auto; padding: 0 40px;
  display: flex; align-items: center; gap: 40px; flex-wrap: wrap;
}
.newsletter__text { flex: 1; min-width: 240px; }
.newsletter__title { font-family: 'Archivo', sans-serif; font-size: 28px; font-weight: 900; color: var(--white); text-transform: uppercase; }
.newsletter__sub { font-size: 14px; color: rgba(255,255,255,0.45); margin-top: 6px; }
.newsletter__form { display: flex; gap: 10px; flex: 1; min-width: 280px; max-width: 480px; }
.newsletter__input {
  flex: 1; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.15);
  border-radius: 6px; padding: 13px 16px; font-size: 15px; color: var(--white);
  font-family: 'Inter', sans-serif; transition: border-color 0.2s;
}
.newsletter__input::placeholder { color: rgba(255,255,255,0.28); }
.newsletter__input:focus { outline: none; border-color: var(--blue-light); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared/components.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const FIXTURES = [
  { date:'26', month:'Apr', comp:'FA Cup Semi-Final', teams:'Chelsea vs Leeds', time:'7:00 AM PDT', venue:'Wembley Stadium', next:true },
  { date:'4',  month:'May', comp:'Premier League', teams:'Chelsea vs Nottm Forest', time:'6:00 AM PDT', venue:'Stamford Bridge', earlyKO:true },
  { date:'9',  month:'May', comp:'Premier League', teams:'Liverpool vs Chelsea', time:'4:30 AM PDT', venue:'Anfield', earlyKO:true },
];

const LEADERBOARD = [
  { rank:1, name:'James T.',  pts:142, initials:'JT' },
  { rank:2, name:'Sarah M.',  pts:138, initials:'SM' },
  { rank:3, name:'Raj P.',    pts:127, initials:'RP' },
  { rank:4, name:'You',       pts:114, initials:'ME', you:true },
  { rank:5, name:'Chris W.',  pts:108, initials:'CW' },
];

function Countdown() {
  const [t, setT] = useState({ d:3, h:14, m:22, s:9 });
  useEffect(() => {
    const iv = setInterval(() => {
      setT(p => {
        let { d, h, m, s } = p;
        s--; if(s<0){s=59;m--;} if(m<0){m=59;h--;} if(h<0){h=23;d--;}
        return { d, h, m, s };
      });
    }, 1000);
    return () => clearInterval(iv);
  }, []);
  return (
    <div className="match-card__countdown">
      {[['d','Days'],['h','Hrs'],['m','Min'],['s','Sec']].map(([k,label],i) => (
        <React.Fragment key={k}>
          {i>0 && <span className="countdown-sep">:</span>}
          <div className="countdown-unit">
            <span className="countdown-num">{String(t[k]).padStart(2,'0')}</span>
            <span className="countdown-label">{label}</span>
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

function MembershipTiers() {
  const tiers = [
    {
      name: 'Adult',
      price: 30,
      note: 'Per year',
      featured: false,
      perks: ['All Brass Fish watch parties','Pub points accrual','CSCV member card','Merchandise welcome pack','Drink discount at the pub','Stamford Bridge eligibility'],
    },
    {
      name: 'Junior',
      price: 10,
      note: 'Under 18 · Per year',
      featured: false,
      perks: ['All of the above (with guardian)','Chelsea FC Junior tie-in','Priority junior seating','Under-18 welcome kit'],
    },
  ];
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginTop:40,maxWidth:740}}>
      {tiers.map(t => (
        <div key={t.name} className="mem-card">
          <div className="mem-card__header">
            <div className="mem-card__name">{t.name} Membership</div>
            <div className="mem-card__price">
              <sup>$</sup>{t.price}<span> CAD {t.note}</span>
            </div>
          </div>
          <div className="mem-card__body">
            <ul className="mem-card__perks">
              {t.perks.map(p => <li key={p}>{p}</li>)}
            </ul>
            <a href="Memberships.html" className="btn btn-primary btn-md mem-card__btn">Join — ${t.price} CAD</a>
          </div>
        </div>
      ))}
    </div>
  );
}

function PaymentOptions() {
  return (
    <div style={{marginTop:28,padding:'20px 24px',background:'var(--off-white)',borderRadius:10,border:'1px solid var(--border)'}}>
      <div style={{fontSize:12,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--muted)',marginBottom:12}}>Payment Options</div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        {[
          {icon:'🅿️', label:'PayPal', note:'Recurring subscription'},
          {icon:'💳', label:'Card',   note:'One-time payment'},
          {icon:'🍁', label:'Interac',note:'e-Transfer to chelseafcvancouver@gmail.com'},
        ].map(p => (
          <div key={p.label} style={{display:'flex',alignItems:'center',gap:8,background:'var(--white)',border:'1px solid var(--border)',borderRadius:7,padding:'9px 14px',fontSize:13}}>
            <span style={{fontSize:16}}>{p.icon}</span>
            <div>
              <div style={{fontWeight:600,color:'var(--text)'}}>{p.label}</div>
              <div style={{fontSize:11,color:'var(--muted)'}}>{p.note}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function NewsletterStrip() {
  const [email, setEmail] = useState('');
  const [done, setDone] = useState(false);
  return (
    <div className="newsletter">
      <div className="newsletter__inner">
        <div className="newsletter__text">
          <div className="newsletter__title">Stay in the Loop</div>
          <div className="newsletter__sub">Match previews, CSCV news, ticket alerts — straight to your inbox. No spam, ever.</div>
        </div>
        {done
          ? <div style={{background:'rgba(34,197,94,0.12)',border:'1px solid rgba(34,197,94,0.3)',borderRadius:8,padding:'14px 20px',color:'#16a34a',fontSize:14}}>Subscribed! Watch your inbox for the latest from CSCV.</div>
          : (
            <form className="newsletter__form" onSubmit={e=>{e.preventDefault();setDone(true)}}>
              <input className="newsletter__input" type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} required />
              <button type="submit" className="btn btn-primary btn-md">Subscribe</button>
            </form>
          )
        }
      </div>
    </div>
  );
}

function HomePage() {
  return (
    <div>
      <Nav cartCount={0} />
      {/* ── HERO ────────────────────────────────────────────────── */}
      <section className="hero">
        <div className="hero__overlay"></div>
        <div className="hero__pattern"></div>
        <div className="hero__inner">
          <div>
            <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:24}}>
              <div style={{width:4,height:36,borderRadius:2,background:'var(--blue)',flexShrink:0}}></div>
              <div className="hero__eyebrow" style={{marginBottom:0,paddingBottom:0,borderBottom:'none'}}>Platinum Supporters Club · Vancouver</div>
            </div>
            <h1 className="hero__title">
              Chelsea<br/>
              <em>Vancouver</em>
            </h1>
            <p className="hero__sub">
              Vancouver's official home for Chelsea supporters. Watch parties at The Brass Fish, Stamford Bridge tickets, pub points, and a community that bleeds blue.
            </p>
            <div className="hero__actions">
              <a href="Memberships.html" className="btn btn-primary btn-lg">Join for $30 CAD</a>
              <a href="Matches.html" className="btn btn-outline btn-lg">Next Match</a>
            </div>
          </div>

          {/* Match card */}
          <div className="match-card">
            <div className="match-card__label">Next Watch Party</div>
            <Countdown />
            <div className="match-card__teams">
              <div className="match-team">
                <div className="match-team__badge" style={{fontSize:13,fontWeight:700,color:'rgba(255,255,255,0.6)',letterSpacing:'0.04em'}}>CFC</div>
                <div className="match-team__name">Chelsea</div>
              </div>
              <div className="match-vs">VS</div>
              <div className="match-team">
                <div className="match-team__badge" style={{fontSize:13,fontWeight:700,color:'rgba(255,255,255,0.6)',letterSpacing:'0.04em'}}>LU</div>
                <div className="match-team__name">Leeds Utd</div>
              </div>
            </div>
            <div className="match-card__meta">
              <div className="match-meta-item">
                <div className="match-meta__label">Kickoff (PDT)</div>
                <div className="match-meta__val">7:00 AM</div>
              </div>
              <div className="match-meta-item">
                <div className="match-meta__label">Date</div>
                <div className="match-meta__val">Apr 26</div>
              </div>
              <div className="match-meta-item span2">
                <div className="match-meta__label">Competition</div>
                <div className="match-meta__val">FA Cup Semi-Final · Wembley</div>
              </div>
              <div className="match-meta-item span2">
                <div className="match-meta__label">Watch at</div>
                <div className="match-meta__val">The Brass Fish, Vancouver</div>
              </div>
            </div>
            <a href="https://www.opentable.com" target="_blank" className="match-card__cta">Reserve Your Seat</a>
          </div>
        </div>
      </section>

      {/* ── STATS STRIP ─────────────────────────────────────────── */}
      <div className="stats-strip">
        <div className="stats-strip__inner">
          {[
            ['380+', 'Active Members'],
            ['25+',  'Years Established'],
            ['#1',   'Platinum Status'],
            ['2,400+','Pub Check-ins'],
          ].map(([n, l]) => (
            <div key={l} className="stat-item">
              <div className="stat-item__num">{n}</div>
              <div className="stat-item__label">{l}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── MEMBERSHIP ──────────────────────────────────────────── */}
      <div className="bg-white">
        <div className="section">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:12}}>
            <div>
              <div className="label">2025–26 Season</div>
              <h2 style={{fontFamily:'Archivo',fontSize:'clamp(32px,4vw,52px)',fontWeight:800,color:'var(--text)',textTransform:'uppercase',lineHeight:1,marginTop:8}}>
                Join Chelsea<br/>Vancouver
              </h2>
              <p style={{fontSize:17,color:'var(--muted)',marginTop:14,lineHeight:1.65,maxWidth:480}}>
                $30 CAD per year. Members get watch-party priority, a merchandise pack, drink discounts, pub points, and access to Stamford Bridge ticket requests.
              </p>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:12,color:'var(--muted)',marginBottom:4}}>Already a member?</div>
              <a href="Memberships.html" className="btn btn-outline btn-md">Renew Membership</a>
            </div>
          </div>
          <MembershipTiers />
          <PaymentOptions />
        </div>
      </div>

      {/* ── UPCOMING FIXTURES ───────────────────────────────────── */}
      <div className="bg-off-white">
        <div className="section">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:28,flexWrap:'wrap',gap:12}}>
            <div>
              <div className="label">Watch Parties</div>
              <h2 style={{fontFamily:'Archivo',fontSize:'clamp(28px,3.5vw,44px)',fontWeight:800,color:'var(--text)',textTransform:'uppercase',lineHeight:1,marginTop:6}}>Upcoming Fixtures</h2>
            </div>
            <a href="Matches.html" className="btn btn-outline btn-md">Full Schedule</a>
          </div>
          {FIXTURES.map(f => (
            <div key={f.date+f.month} className={`fixture-row${f.next?' fixture-row--next':''}`}>
              <div className="fixture-date">
                <div className="fixture-date__day">{f.date}</div>
                <div className="fixture-date__month">{f.month}</div>
              </div>
              <div className="fixture-divider"></div>
              <div className="fixture-info">
                <div className="fixture-info__comp">
                  {f.comp} {f.next && <span className="badge badge-blue" style={{marginLeft:6}}>Next Up</span>}
                </div>
                <div className="fixture-info__teams">{f.teams}</div>
                <div className="fixture-info__meta">{f.time} · {f.venue}</div>
              </div>
              <a href="https://www.opentable.com" target="_blank" className="btn btn-primary btn-sm">Reserve Seat</a>
            </div>
          ))}
          <div style={{marginTop:14,textAlign:'center'}}>
            <a href="Matches.html" style={{fontSize:13,color:'var(--blue)',fontWeight:600}}>View all fixtures and add to calendar</a>
          </div>
        </div>
      </div>

      {/* ── SITE NAVIGATION PANEL ───────────────────────────── */}
      <div style={{background:'var(--off-white)',borderTop:'1px solid var(--border)',borderBottom:'1px solid var(--border)'}}>
        <div className="section--sm">
          <div style={{marginBottom:24}}>
            <div className="label label--blue">Everything on This Site</div>
            <h2 style={{fontFamily:'Archivo',fontSize:'clamp(22px,3vw,32px)',fontWeight:800,color:'var(--text)',textTransform:'uppercase',lineHeight:1,marginTop:6}}>Quick Navigation</h2>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
            {[
              { href:'News.html',          label:'Latest Email & News',              sub:'Club updates + Chelsea RSS' },
              { href:'Matches.html',       label:'Matches & Events',                 sub:'Fixtures in Vancouver PT' },
              { href:'Memberships.html',   label:'Memberships',                      sub:'Join for $30 CAD / $10 Junior' },
              { href:'FAQs.html',          label:'Membership FAQs',                  sub:'Chelsea FC + CSCV questions' },
              { href:'Tickets.html',       label:'Chelsea Match Tickets',            sub:'Stamford Bridge requests' },
              { href:'Pub Points.html',    label:'Attendance Prizes',                sub:'Leaderboard + reward ladder' },
              { href:'Shop.html',          label:'Shop',                             sub:'T-shirts, stickers, bundles' },
              { href:'Gallery.html',       label:'Gallery',                          sub:'Photos by season & event' },
              { href:'Annual Report.html', label:'Annual Report',                    sub:'Financials + president\'s report' },
              { href:'About.html',         label:'About CSCV',                       sub:'History, board, affiliations' },
              { href:'Contact.html',       label:'Contact',                          sub:'Get in touch with the club' },
              { href:'Privacy.html',       label:'Privacy & Cookie Policy',          sub:'How we handle your data' },
            ].map(p => (
              <a key={p.href} href={p.href} style={{
                display:'block', background:'var(--white)', border:'1.5px solid var(--border)',
                borderRadius:8, padding:'14px 16px', textDecoration:'none',
                transition:'border-color 0.18s, box-shadow 0.18s, transform 0.15s'
              }}
                onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--blue)';e.currentTarget.style.boxShadow='0 4px 16px rgba(3,70,148,0.08)';e.currentTarget.style.transform='translateY(-1px)'}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.boxShadow='none';e.currentTarget.style.transform='none'}}
              >
                <div style={{fontFamily:'Archivo',fontSize:14,fontWeight:800,color:'var(--text)',marginBottom:3,lineHeight:1.2}}>{p.label}</div>
                <div style={{fontSize:11,color:'var(--muted)'}}>{p.sub}</div>
              </a>
            ))}
          </div>
        </div>
      </div>

      {/* ── PUB POINTS ──────────────────────────────────────────── */}
      <div className="bg-dark">
        <div className="section">
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:64,alignItems:'center'}}>
            <div>
              <h2 style={{fontFamily:'Archivo',fontSize:'clamp(32px,4vw,52px)',fontWeight:800,color:'var(--white)',textTransform:'uppercase',lineHeight:1,marginBottom:16}}>
                Climb the<br/>Leaderboard
              </h2>
              <p style={{fontSize:16,color:'rgba(255,255,255,0.55)',lineHeight:1.7,marginBottom:28}}>
                Every match you attend earns points. Top members get first pick of Stamford Bridge tickets and end-of-season prizes — caps, scarves, retro shirts, current kits.
              </p>
              <a href="Pub Points.html" className="btn btn-primary btn-md">View Full Leaderboard</a>
            </div>
            <div>
              {LEADERBOARD.map(m => (
                <div key={m.rank} className={`lb-row${m.you?' lb-row--you':''}`}>
                  <div className={`lb-rank${m.rank<=3?' lb-rank--top':''}`}>#{m.rank}</div>
                  <div className={`lb-avatar${m.you?' lb-avatar--you':''}`}>{m.initials}</div>
                  <div className="lb-name">{m.you ? <strong>You</strong> : m.name}</div>
                  <div style={{textAlign:'right'}}>
                    <div className="lb-pts">{m.pts}</div>
                    <div className="lb-pts-sub">pts</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* ── PUB PARTNER ─────────────────────────────────────────── */}
      <div className="bg-white">
        <div className="section--sm">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,flexWrap:'wrap',gap:8}}>
            <div className="label label--blue">Official Pub Partner</div>
          </div>
          <div className="pub-block">
            <div className="pub-block__icon">The<br/>Pub</div>
            <div className="pub-block__body">
              <div className="pub-block__name">The Brass Fish</div>
              <div className="pub-block__detail">
                Vancouver's official CSCV watch-party venue · Every match day on the big screen · Check in for pub points · Member-priority seating held until 30 min before kickoff · Exclusive member drink discount
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:8,flexShrink:0}}>
              <a href="https://www.opentable.com" target="_blank" className="btn btn-primary btn-md">Reserve via OpenTable</a>
              <a href="Matches.html" className="btn btn-outline btn-sm" style={{textAlign:'center'}}>Match Schedule</a>
            </div>
          </div>

          {/* Affiliations */}
          <div style={{marginTop:32,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
            <div style={{fontSize:12,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--muted)',marginRight:4}}>Affiliations:</div>
            {[
              {img:'uploads/Chelsea_Vancouver.png',        label:'CFC Platinum Club'},
              {img:'uploads/Screen_Shot_2022-03-12_at_7.43.14_PM.jpg', label:"Chelsea Supporters' Trust"},
            ].map(a => (
              <div key={a.label} style={{display:'flex',alignItems:'center',gap:8,background:'var(--off-white)',border:'1px solid var(--border)',borderRadius:6,padding:'7px 14px'}}>
                <img src={a.img} alt={a.label} style={{height:26,objectFit:'contain'}} />
                <span style={{fontSize:12,fontWeight:600,color:'var(--muted)'}}>{a.label}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── LATEST NEWS TEASER ──────────────────────────────────── */}
      <div className="bg-off-white" style={{borderTop:'1px solid var(--border)'}}>
        <div className="section--sm">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24,flexWrap:'wrap',gap:8}}>
            <div>
              <div className="label label--blue">Club Updates</div>
              <h2 style={{fontFamily:'Archivo',fontSize:'clamp(24px,3vw,36px)',fontWeight:800,color:'var(--text)',textTransform:'uppercase',lineHeight:1,marginTop:6}}>Latest News</h2>
            </div>
            <a href="News.html" className="btn btn-outline btn-sm">All News</a>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:20}}>
            {[
              {cat:'Club News',  title:'Our Vegas Trip: 22 Members Hit Sin City for Chelsea vs Man Utd', date:'Apr 14'},
              {cat:'Membership', title:'2025–26 Memberships Now Open — $30 Adult / $10 Junior',         date:'Apr 1'},
              {cat:'Tickets',    title:'Stamford Bridge Ticket Window — Deadline April 30',              date:'Mar 22'},
            ].map(n => (
              <div key={n.title} style={{background:'var(--white)',border:'1px solid var(--border)',borderRadius:10,padding:'20px',cursor:'pointer',transition:'box-shadow 0.18s,border-color 0.18s'}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--blue)';e.currentTarget.style.boxShadow='0 6px 24px rgba(3,70,148,0.08)'}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border)';e.currentTarget.style.boxShadow='none'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                  <span className="badge badge-blue">{n.cat}</span>
                  <span style={{fontSize:12,color:'var(--muted)'}}>{n.date}</span>
                </div>
                <h3 style={{fontFamily:'Archivo',fontSize:16,fontWeight:700,color:'var(--text)',lineHeight:1.35}}>{n.title}</h3>
                <div style={{marginTop:12,fontSize:13,color:'var(--blue)',fontWeight:600}}>Read more</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── NEWSLETTER ──────────────────────────────────────────── */}
      <NewsletterStrip />

      <Footer />
      <CookieBanner />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HomePage />);
</script>
</body>
</html>
