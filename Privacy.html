<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy & Cookie Policy — Chelsea Supporters Club Vancouver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<style>
.policy-body { max-width: 760px; }
.policy-body h2 { font-family:'Archivo',sans-serif; font-size:22px; font-weight:800; color:var(--text); margin:36px 0 10px; }
.policy-body h3 { font-family:'Archivo',sans-serif; font-size:16px; font-weight:700; color:var(--text); margin:22px 0 8px; }
.policy-body p  { font-size:15px; color:var(--muted); line-height:1.8; margin-bottom:14px; }
.policy-body ul { padding-left:20px; margin-bottom:14px; }
.policy-body ul li { font-size:15px; color:var(--muted); line-height:1.75; margin-bottom:4px; }
.policy-body a  { color:var(--blue); font-weight:600; }
.policy-toc { background:var(--off-white); border:1px solid var(--border); border-radius:10px; padding:22px 26px; margin-bottom:40px; }
.policy-toc__title { font-family:'Archivo',sans-serif; font-size:13px; font-weight:800; color:var(--text); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:12px; }
.policy-toc a { display:block; font-size:14px; color:var(--blue); padding:4px 0; border-bottom:1px solid var(--border); font-weight:500; }
.policy-toc a:last-child { border-bottom:none; }
.last-updated { font-size:12px; color:var(--muted); margin-bottom:32px; padding:10px 14px; background:var(--off-white); border-radius:6px; border:1px solid var(--border); display:inline-block; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared/components.jsx"></script>
<script type="text/babel">
function PrivacyPage() {
  return (
    <div>
      <Nav />
      <PageHeader label="Legal" title="Privacy & Cookie Policy" sub="How we collect, use and protect your personal information." />
      <div className="bg-white">
        <div className="section">
          <div className="policy-body">
            <div className="last-updated">Last updated: April 2025</div>

            <div className="policy-toc">
              <div className="policy-toc__title">Contents</div>
              {[
                ['#who-we-are','Who We Are'],
                ['#data-we-collect','Data We Collect'],
                ['#how-we-use','How We Use Your Data'],
                ['#sharing','Sharing Your Data'],
                ['#retention','Data Retention'],
                ['#your-rights','Your Rights'],
                ['#cookies','Cookie Policy'],
                ['#contact','Contact & Complaints'],
              ].map(([href, label]) => (
                <a key={href} href={href}>{label}</a>
              ))}
            </div>

            <h2 id="who-we-are">1. Who We Are</h2>
            <p>Chelsea Supporters Club Vancouver (CSCV) is a registered non-profit society in British Columbia, Canada. We are an officially recognized Platinum Supporters Club of Chelsea Football Club Limited. Our registered contact email is <a href="mailto:chelseafcvancouver@gmail.com">chelseafcvancouver@gmail.com</a>.</p>
            <p>This policy covers our website (cscv.ca), membership system, shop, and communications. It applies to all personal data we process about members, visitors, and anyone who contacts us.</p>

            <h2 id="data-we-collect">2. Data We Collect</h2>
            <h3>Membership data</h3>
            <ul>
              <li>Full name, email address, phone number</li>
              <li>Chelsea FC membership number and tier</li>
              <li>Date of birth (Junior memberships only)</li>
              <li>Payment method and transaction reference (we do not store card numbers)</li>
              <li>Pub points history and match attendance records</li>
            </ul>
            <h3>Shop orders</h3>
            <ul>
              <li>Name, email, shipping address</li>
              <li>Order history and item details</li>
            </ul>
            <h3>Website usage</h3>
            <ul>
              <li>Pages visited, time on site, referring URL (via analytics cookies)</li>
              <li>Browser type, operating system, IP address (anonymized where possible)</li>
            </ul>
            <h3>Communications</h3>
            <ul>
              <li>Email and SMS subscription preferences</li>
              <li>Content of contact form messages</li>
            </ul>

            <h2 id="how-we-use">3. How We Use Your Data</h2>
            <ul>
              <li>To administer your CSCV membership and send renewal reminders</li>
              <li>To process shop orders and arrange shipping or pub pickup</li>
              <li>To run the pub points leaderboard and allocate Stamford Bridge tickets</li>
              <li>To send match alerts, newsletters, and club news (only with your consent)</li>
              <li>To comply with our reporting obligations to Chelsea FC as an official supporters club</li>
              <li>To improve our website and communications</li>
            </ul>
            <p>Our legal basis for processing is primarily <strong>contract performance</strong> (membership administration) and <strong>legitimate interests</strong> (club operations). For marketing communications, we rely on your <strong>explicit consent</strong>.</p>

            <h2 id="sharing">4. Sharing Your Data</h2>
            <p>We share limited personal data with:</p>
            <ul>
              <li><strong>Chelsea Football Club Limited</strong> — name and membership number for supporters club administration and ticket allocation (required as a condition of our Platinum status).</li>
              <li><strong>Payment processors</strong> (PayPal, Stripe) — for transaction processing only. They are independent data controllers under their own privacy policies.</li>
              <li><strong>MailChimp</strong> — for email newsletters, if you have subscribed.</li>
              <li><strong>Twilio</strong> — for SMS match alerts, if you have opted in.</li>
            </ul>
            <p>We do not sell your data to any third party. We do not share data with advertisers.</p>

            <h2 id="retention">5. Data Retention</h2>
            <p>We retain membership data for up to 3 years after your last active membership, in case of renewal. Transaction records are kept for 7 years for tax and legal compliance. You may request earlier deletion — see Your Rights below.</p>

            <h2 id="your-rights">6. Your Rights (PIPEDA / BC PIPA)</h2>
            <p>Under Canadian privacy law (PIPEDA and BC PIPA), you have the right to:</p>
            <ul>
              <li><strong>Access</strong> the personal data we hold about you</li>
              <li><strong>Correct</strong> inaccurate data</li>
              <li><strong>Withdraw consent</strong> for marketing communications at any time</li>
              <li><strong>Request deletion</strong> of your data (subject to legal retention obligations)</li>
              <li><strong>Lodge a complaint</strong> with the Office of the Privacy Commissioner of Canada</li>
            </ul>
            <p>To exercise any of these rights, email <a href="mailto:chelseafcvancouver@gmail.com">chelseafcvancouver@gmail.com</a>. We will respond within 30 days.</p>

            <h2 id="cookies">7. Cookie Policy</h2>
            <h3>What are cookies?</h3>
            <p>Cookies are small text files stored on your device when you visit a website. They help us remember your preferences and understand how you use our site.</p>
            <h3>Cookies we use</h3>
            <ul>
              <li><strong>Essential cookies</strong> — required for the site to function (e.g. session management, cookie consent preference). Cannot be disabled.</li>
              <li><strong>Analytics cookies</strong> — help us understand page views and visitor behaviour (Plausible Analytics, privacy-friendly, no cross-site tracking). Only set with your consent.</li>
              <li><strong>Functional cookies</strong> — remember your preferences (e.g. newsletter opt-in, cart contents). Only set with your consent.</li>
            </ul>
            <p>We do not use advertising or tracking cookies. We do not share cookie data with advertisers.</p>
            <h3>Managing cookies</h3>
            <p>You can withdraw your consent to non-essential cookies at any time using the cookie settings banner. You can also clear cookies through your browser settings at any time.</p>

            <h2 id="contact">8. Contact & Complaints</h2>
            <p>For any privacy questions or to exercise your rights, contact our Privacy Officer at <a href="mailto:chelseafcvancouver@gmail.com">chelseafcvancouver@gmail.com</a>.</p>
            <p>If you are not satisfied with our response, you may contact the <a href="https://www.priv.gc.ca" target="_blank">Office of the Privacy Commissioner of Canada</a>.</p>
            <p>We may update this policy from time to time. Material changes will be communicated to members by email. The date at the top of this page reflects the most recent revision.</p>
          </div>
        </div>
      </div>
      <Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<PrivacyPage />);
</script>
</body>
</html>
